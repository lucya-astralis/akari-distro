# Akari OS: the console greets as Akari OS. agetty reads Akari's issue
# instead of Debian's /etc/issue (that stays as base-files ships it), then
# /etc/issue.d and /run/issue.d, where akarid puts the address and QR code.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear --issue-file /usr/lib/akari-base/issue:/etc/issue.d:/run/issue.d - ${TERM}
