# Akari OS: GRUB keeps calling the system "Debian" for now. The name also
# decides the EFI folder grub-install uses (EFI/<name>), and Debian's signed
# GRUB for Secure Boot belongs in EFI/debian. Akari's name in the boot menu
# comes with the ISO (phase 3), once that is tested on UEFI with Secure Boot.
GRUB_DISTRIBUTOR=Debian
