# Akari OS: GRUB on the installed system.
#
# The name stays "Debian" for now. It also decides the EFI folder grub-install
# uses (EFI/<name>), and Debian's signed GRUB for Secure Boot belongs in
# EFI/debian. Akari shows through the theme instead.
GRUB_DISTRIBUTOR=Debian
GRUB_THEME=/usr/share/grub/themes/akari/theme.txt
GRUB_GFXMODE=1920x1080,1280x800,1024x768,auto

# The theme needs graphics (gfxterm). A serial console (Proxmox, virsh) keeps
# working next to it; whoever chose a text console only keeps that.
case " ${GRUB_TERMINAL:-} ${GRUB_TERMINAL_OUTPUT:-} " in
  *serial*) GRUB_TERMINAL_INPUT="console serial"; GRUB_TERMINAL_OUTPUT="gfxterm serial"; unset GRUB_TERMINAL ;;
  *" console "*) ;;
  *) GRUB_TERMINAL_OUTPUT=gfxterm ;;
esac
