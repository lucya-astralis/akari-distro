# The Akari OS installer ISO: Debian's netinst, checked and rebuilt with Akari's
# preseed (iso/build-iso.sh), then installed unattended in QEMU and checked
# from outside (iso/test/smoke.sh). The ISO is kept as an artifact of the run.
name: iso
on:
  push:
    branches: [main]
    paths: ["iso/**", "keys/**", "packages/akari-base/**", ".github/workflows/iso.yml"]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"    # weekly: Debian's point releases, Akari's stable

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: KVM für QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xorriso gpgv debian-keyring qemu-system-x86 qemu-utils ovmf librsvg2-bin imagemagick cpio >/dev/null
      - uses: actions/cache@v4
        with:
          path: out/.cache
          key: debian-netinst-${{ github.run_id }}
          restore-keys: debian-netinst-
      - name: ISO bauen
        env:
          APT_URL: ${{ vars.APT_URL || 'https://apt.lucya.systems' }}
        run: iso/build-iso.sh out
      - name: Bilder (Bootmenü BIOS/UEFI, Installer)
        run: iso/test/screens.sh out/akari-os-*.iso screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*.png
      - name: Rauchtest in QEMU
        run: iso/test/smoke.sh out/akari-os-*.iso work
      - uses: actions/upload-artifact@v4
        with:
          name: akari-os-iso
          path: |
            out/akari-os-*.iso
            out/akari-os-*.iso.sha256
            out/akari-os-*.base
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: work/*.log
