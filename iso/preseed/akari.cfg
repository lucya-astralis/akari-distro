# Akari OS: what the installer does on top of a Debian 13 install.
# Language, keyboard, network, host name, disk and the first account are
# asked as usual; everything here is what Akari OS decides itself.
# @APT_URL@ is set when the ISO is built.

# No root password: the first account manages (sudo), as on Akari OS anywhere.
d-i passwd/root-login boolean false

# Debian from its own mirror, Akari from its archive (the key is on the ISO).
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/local0/repository string @APT_URL@ stable main
d-i apt-setup/local0/comment string Akari OS
d-i apt-setup/local0/key string file:///cdrom/akari/akari-archive-keyring.asc
d-i apt-setup/local0/source boolean false

# No desktop from Debian: Akari is the desktop, in the browser.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string akari-desktop akari-base akari-archive-keyring
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Afterwards: Akari's source the way akari-distro publishes it (deb822, Signed-By
# its keyring package) instead of the line apt-setup wrote, and zsh for the
# first account.
d-i preseed/late_command string \
  in-target sh -c 'sed -i "\|@APT_URL@|d" /etc/apt/sources.list; rm -f /etc/apt/trusted.gpg.d/local0*; \
    printf "Types: deb\nURIs: @APT_URL@\nSuites: stable\nComponents: main\nSigned-By: /usr/share/keyrings/akari-archive-keyring.gpg\n" > /etc/apt/sources.list.d/akari.sources; \
    u=$(getent passwd 1000 | cut -d: -f1); [ -n "$u" ] && chsh -s /bin/zsh "$u" || true'
